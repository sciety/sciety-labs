[project]
name = "sciety-labs"
version = "0.0.0"
description = "Sciety Labs (Experimental)"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiohttp[speedups]>=3.14.3",
    "aiohttp-client-cache[sqlite]>=0.14.3",
    "asyncstdlib>=3.14.0",
    "bleach>=6.4.0",
    "fastapi>=0.141.1",
    "google-api-python-client>=2.198.0",
    "google-cloud-bigquery>=3.43.0",
    "google-cloud-bigquery-storage>=2.40.0",
    "Jinja2>=3.1.6",
    "lxml>=6.1.1",
    "objsize>=0.8.0",
    "opensearch-py>=3.2.0",
    "pandas>=3.0.5",
    "pyarrow>=25.0.0",
    "PyYAML>=6.0.3",
    "requests>=2.34.2",
    "requests-cache>=1.3.3",
    "uvicorn[standard]>=0.52.3",
]

[dependency-groups]
dev = [
    "flake8>=7.3.0",
    "locust>=2.46.3",
    "pylint>=3.3.7",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-watch>=4.2.0",
    "mypy>=2.3.0",
    "httpx>=0.28.1",
    "types-bleach>=6.4.0.20260728",
    "types-PyYAML>=6.0.12.20260724",
    "types-requests>=2.33.0.20260712",
]

# The application is run from the working directory (`python -m uvicorn ...`),
# never imported as an installed distribution, so uv only manages dependencies.
[tool.uv]
package = false
